name: Database Tests
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Run migrations
        run: supabase db reset
      - name: Run tests
        run: supabase test db
